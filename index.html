<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d22" />
  <meta name="description" content="Aetherbound — a single-player fantasy summoning RPG. Collect heroes, master elements, and rise through the Aether." />
  <title>Aetherbound — Fantasy Summon RPG</title>
  <link rel="stylesheet" href="style.css?v=20260520f" />
  <style>
    /* Inline boot-fail UI — never depends on style.css loading */
    #boot-fail {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: #0a0d22; color: #ecefff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 32px 20px; box-sizing: border-box; overflow: auto;
    }
    #boot-fail.show { display: block; }
    #boot-fail h1 { color: #ff6e7c; margin: 0 0 12px; font-size: 22px; }
    #boot-fail p { color: #a4adcf; line-height: 1.5; max-width: 640px; }
    #boot-fail pre {
      background: #131739; border: 1px solid rgba(255,255,255,0.08);
      padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px;
      max-height: 240px; max-width: 100%;
    }
    #boot-fail button {
      background: #2a3170; color: #ecefff; border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
      margin-right: 8px; margin-top: 12px;
    }
    #boot-fail button.primary { background: #f5c46c; color: #0a0d22; font-weight: 600; }
    #boot-fail button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <!-- screens are mounted dynamically -->
  </div>

  <!-- Reusable SVG defs (gradients, filters) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Boot-failure fallback UI: shown by the error handler below if anything crashes during init. -->
  <div id="boot-fail" role="alert" aria-live="assertive">
    <h1>The game failed to launch</h1>
    <p>This usually means your browser cached an old broken version, or your save data is corrupted from an earlier build. Try the buttons below in order.</p>
    <p><strong>Error:</strong></p>
    <pre id="boot-fail-msg">(no error captured)</pre>
    <button class="primary" onclick="location.reload(true)">Hard reload</button>
    <button onclick="try{localStorage.removeItem('aetherbound.save.v1');}catch(e){}location.reload(true)">Reset save &amp; reload</button>
    <button onclick="try{localStorage.clear();}catch(e){}location.reload(true)">Nuke all storage &amp; reload</button>
  </div>

  <script>
    // Boot guard. Catches uncaught errors and unhandled promise rejections during page load,
    // shows the fallback UI so the user never sees a blank screen.
    (function () {
      var BOOT_TIMEOUT_MS = 6000;
      var booted = false;
      function showFail(msg) {
        try {
          var el = document.getElementById('boot-fail');
          var pre = document.getElementById('boot-fail-msg');
          if (pre && msg) pre.textContent = String(msg).substring(0, 1200);
          if (el) el.classList.add('show');
        } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        if (booted) return;
        showFail((e.message || 'Unknown error') + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (booted) return;
        showFail('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      // Watchdog: if __GAME__ never initialises, show the fail UI.
      setTimeout(function () {
        if (window.__GAME__) { booted = true; return; }
        showFail('Game did not initialise within ' + BOOT_TIMEOUT_MS + 'ms. Modules loaded: ' +
          ['GAME_DATA','GAME_ART','GAME_SAVE','GAME_SUMMON','GAME_AUDIO','GAME_COMBAT','GAME_UI']
            .filter(function (k) { return !!window[k]; }).join(', ') || '(none)');
      }, BOOT_TIMEOUT_MS);
      // Emergency reset via URL: index.html?reset=1
      if (/[?&]reset=1\b/.test(location.search)) {
        try { localStorage.removeItem('aetherbound.save.v1'); } catch (e) {}
        // Strip the query to avoid loops
        history.replaceState(null, '', location.pathname);
      }
    })();
  </script>

  <script src="data.js?v=20260520f"></script>
  <script src="art.js?v=20260520f"></script>
  <script src="sprites.js?v=20260520f"></script>
  <script src="save.js?v=20260520f"></script>
  <script src="summon.js?v=20260520f"></script>
  <script src="audio.js?v=20260520f"></script>
  <script src="combat.js?v=20260520f"></script>
  <script src="ui.js?v=20260520f"></script>
  <script src="game.js?v=20260520f"></script>
</body>
</html>
